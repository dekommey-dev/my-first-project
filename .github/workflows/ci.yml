name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # src/*.test.ts를 Node가 직접 실행하므로 22.18+ 필요
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
