<title>Aida</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap">

<style>
/* ═══ Tokens ═══════════════════════════════════════════════════════════════
   Aida runs on a stream: SSE frames arriving one at a time. The identity is
   an instrument panel for that stream — cool teal-biased neutrals, hairline
   rules, one saturated signal colour reserved for live state. */

:root {
  color-scheme: light;
  --ground: #f6f8f8;
  --surface: #ffffff;
  --sunken: #edf1f1;
  --raised: #ffffff;
  --hover: #e2e8e8;
  --line: #d9dfdf;
  --line-strong: #bcc6c6;
  --ink: #0f1f1e;
  --ink-2: #52615f;
  --ink-3: #8b9897;
  --accent: #0d7d84;
  --accent-soft: #e2f1f2;
  --accent-ink: #ffffff;
  --warn: #96601a;
  --warn-soft: #f8f0e2;
  --danger: #a33a34;
  --code-ground: #eff3f3;
  --shadow-sm: 0 1px 2px rgb(15 31 30 / 0.06);
  --shadow-lg: 0 2px 4px rgb(15 31 30 / 0.05), 0 12px 32px rgb(15 31 30 / 0.10);

  --ui: 'Instrument Sans', 'Noto Sans KR', -apple-system, BlinkMacSystemFont,
        'Segoe UI', 'Apple SD Gothic Neo', sans-serif;
  --mono: 'IBM Plex Mono', 'SFMono-Regular', Menlo, Consolas, monospace;
}

/* System default (no data-theme stamped): only prefers-color-scheme decides.
   Guarded so an explicit light choice still beats a dark OS. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: #0d1313;
    --surface: #131a1a;
    --sunken: #101616;
    --raised: #18201f;
    --hover: #202a29;
    --line: #253130;
    --line-strong: #384746;
    --ink: #e5eded;
    --ink-2: #9aa8a7;
    --ink-3: #6a7877;
    --accent: #45bcc2;
    --accent-soft: #13292b;
    --accent-ink: #06100f;
    --warn: #d9a44e;
    --warn-soft: #241d10;
    --danger: #e58074;
    --code-ground: #0a1010;
    --shadow-sm: 0 1px 2px rgb(0 0 0 / 0.35);
    --shadow-lg: 0 2px 4px rgb(0 0 0 / 0.3), 0 12px 32px rgb(0 0 0 / 0.45);
  }
}

/* Explicit choice from the toggle wins in both directions. */
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #0d1313;
  --surface: #131a1a;
  --sunken: #101616;
  --raised: #18201f;
  --hover: #202a29;
  --line: #253130;
  --line-strong: #384746;
  --ink: #e5eded;
  --ink-2: #9aa8a7;
  --ink-3: #6a7877;
  --accent: #45bcc2;
  --accent-soft: #13292b;
  --accent-ink: #06100f;
  --warn: #d9a44e;
  --warn-soft: #241d10;
  --danger: #e58074;
  --code-ground: #0a1010;
  --shadow-sm: 0 1px 2px rgb(0 0 0 / 0.35);
  --shadow-lg: 0 2px 4px rgb(0 0 0 / 0.3), 0 12px 32px rgb(0 0 0 / 0.45);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  height: 100dvh;
  overflow: hidden;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--ui);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

button, input, textarea, select { font: inherit; color: inherit; }

/* Class rules below set , which outranks the UA's [hidden] rule and
   leaves "hidden" panels laid out and swallowing clicks. This wins them back. */
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
</style>

<style>
/* ═══ Shell ════════════════════════════════════════════════════════════════ */

.shell {
  display: grid;
  grid-template-rows: auto 1fr;
  height: 100dvh;
}

/* The preview strip is the first thing read, so it says plainly what this page
   is before anyone types into it. */
.strip {
  display: flex;
  gap: 12px;
  align-items: center;
  padding: 7px 16px;
  background: var(--warn-soft);
  border-bottom: 1px solid var(--line);
}

.strip__tag {
  display: inline-flex;
  gap: 6px;
  align-items: center;
  flex-shrink: 0;
  color: var(--warn);
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.strip__dot {
  width: 6px;
  height: 6px;
  background: var(--warn);
  border-radius: 50%;
}

.strip__text {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  color: var(--ink-2);
  font-size: 12.5px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.strip__actions { display: flex; gap: 4px; flex-shrink: 0; }

.workspace {
  display: grid;
  grid-template-columns: 262px 1fr;
  min-height: 0;
  overflow: hidden;
}

.workspace[data-sidebar="closed"] { grid-template-columns: 0 1fr; }

/* ═══ Sidebar ══════════════════════════════════════════════════════════════ */

.sidebar {
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-height: 0;
  padding: 14px 12px;
  overflow: hidden;
  background: var(--sunken);
  border-right: 1px solid var(--line);
}

.workspace[data-sidebar="closed"] .sidebar { padding: 0; border-right: none; }

.sidebar__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.brand {
  display: flex;
  gap: 9px;
  align-items: center;
  white-space: nowrap;
}

.brand__mark {
  display: grid;
  place-items: center;
  width: 24px;
  height: 24px;
  color: var(--accent-ink);
  background: var(--accent);
  border-radius: 7px;
}

.brand__name {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -0.015em;
}

.brand__sub {
  color: var(--ink-3);
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.new-chat {
  display: flex;
  gap: 8px;
  align-items: center;
  padding: 9px 12px;
  font-size: 14px;
  font-weight: 500;
  white-space: nowrap;
  cursor: pointer;
  background: var(--raised);
  border: 1px solid var(--line);
  border-radius: 9px;
  box-shadow: var(--shadow-sm);
}

.new-chat:hover { background: var(--hover); border-color: var(--line-strong); }

.conv-scroll {
  display: flex;
  flex: 1;
  flex-direction: column;
  gap: 1px;
  min-height: 0;
  margin: 2px -4px 0;
  padding: 0 4px;
  overflow-y: auto;
}

.conv-label {
  padding: 10px 8px 5px;
  color: var(--ink-3);
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.conv {
  display: flex;
  gap: 2px;
  align-items: center;
  padding: 1px 4px 1px 10px;
  border-radius: 8px;
}

.conv:hover, .conv[aria-current="true"] { background: var(--hover); }

.conv[aria-current="true"] { box-shadow: inset 2px 0 0 var(--accent); }

.conv__open {
  flex: 1;
  min-width: 0;
  padding: 7px 0;
  overflow: hidden;
  font-size: 13.5px;
  text-align: left;
  text-overflow: ellipsis;
  white-space: nowrap;
  cursor: pointer;
  background: none;
  border: none;
}

.conv__rename {
  flex: 1;
  min-width: 0;
  padding: 5px 7px;
  background: var(--surface);
  border: 1px solid var(--accent);
  border-radius: 6px;
}

.conv__tools { display: none; gap: 1px; }
.conv:hover .conv__tools, .conv[aria-current="true"] .conv__tools { display: flex; }

.sidebar__foot {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding-top: 10px;
  border-top: 1px solid var(--line);
}

.foot-btn {
  display: flex;
  gap: 9px;
  align-items: center;
  width: 100%;
  padding: 8px 10px;
  color: var(--ink-2);
  font-size: 13.5px;
  text-align: left;
  cursor: pointer;
  background: none;
  border: none;
  border-radius: 8px;
}

.foot-btn:hover { color: var(--ink); background: var(--hover); }

/* ═══ Buttons ══════════════════════════════════════════════════════════════ */

.ibtn {
  display: grid;
  flex-shrink: 0;
  place-items: center;
  width: 30px;
  height: 30px;
  color: var(--ink-3);
  cursor: pointer;
  background: none;
  border: none;
  border-radius: 7px;
}

.ibtn:hover { color: var(--ink); background: var(--hover); }
.ibtn--sm { width: 25px; height: 25px; }
.ibtn--sm svg { width: 14px; height: 14px; }
.ibtn--danger:hover { color: var(--danger); }

/* ═══ Chat pane ════════════════════════════════════════════════════════════ */

.pane {
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  background: var(--ground);
}

.pane__top {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-shrink: 0;
  padding: 9px 16px;
  border-bottom: 1px solid var(--line);
}

.pane__title {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  font-size: 14.5px;
  font-weight: 600;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.chip {
  display: inline-flex;
  gap: 6px;
  align-items: center;
  padding: 3px 10px;
  color: var(--ink-2);
  font-family: var(--mono);
  font-size: 11px;
  white-space: nowrap;
  background: var(--sunken);
  border: 1px solid var(--line);
  border-radius: 999px;
}

.chip__dot {
  width: 5px;
  height: 5px;
  background: var(--accent);
  border-radius: 50%;
}

.thread {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  scrollbar-gutter: stable;
}

.thread__inner {
  display: flex;
  flex-direction: column;
  gap: 24px;
  width: min(748px, 100%);
  margin: 0 auto;
  padding: 26px 20px 10px;
}

/* ═══ Turns ════════════════════════════════════════════════════════════════ */

.turn { display: flex; gap: 13px; align-items: flex-start; }
.turn--you { justify-content: flex-end; }

.turn__mark {
  display: grid;
  flex-shrink: 0;
  place-items: center;
  width: 27px;
  height: 27px;
  margin-top: 1px;
  color: var(--accent-ink);
  background: var(--accent);
  border-radius: 8px;
}

.turn__body { flex: 1; min-width: 0; }

.turn--you .turn__body {
  flex: 0 1 auto;
  max-width: min(76%, 540px);
  padding: 10px 15px;
  background: var(--sunken);
  border: 1px solid var(--line);
  border-radius: 15px 15px 4px 15px;
}

.turn__said { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }

.turn__meta {
  display: flex;
  gap: 3px;
  align-items: center;
  margin-top: 5px;
  opacity: 0;
  transition: opacity 120ms ease;
}

.turn:hover .turn__meta, .turn__meta:focus-within { opacity: 1; }
.turn--you .turn__meta { justify-content: flex-end; }

.turn__stamp {
  margin-left: auto;
  color: var(--ink-3);
  font-family: var(--mono);
  font-size: 10.5px;
}

.flash { color: var(--accent); font-family: var(--mono); font-size: 10.5px; }

/* Reasoning panel — only shown when the setting is on. */
.reasoning {
  margin-bottom: 11px;
  padding: 9px 13px;
  color: var(--ink-2);
  font-size: 13px;
  background: var(--sunken);
  border: 1px solid var(--line);
  border-left: 2px solid var(--accent);
  border-radius: 4px 9px 9px 4px;
}

.reasoning summary {
  font-family: var(--mono);
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  cursor: pointer;
}

.reasoning p { margin: 7px 0 0; white-space: pre-wrap; }

.caret {
  display: inline-block;
  width: 7px;
  height: 15px;
  margin-left: 1px;
  vertical-align: -2px;
  background: var(--accent);
  animation: blink 1s steps(2, start) infinite;
}

@keyframes blink { 50% { opacity: 0; } }

.waiting { display: inline-flex; gap: 4px; padding: 7px 0; }

.waiting i {
  width: 5px;
  height: 5px;
  background: var(--ink-3);
  border-radius: 50%;
  animation: bob 1.1s ease-in-out infinite;
}

.waiting i:nth-child(2) { animation-delay: 0.14s; }
.waiting i:nth-child(3) { animation-delay: 0.28s; }

@keyframes bob {
  0%, 60%, 100% { opacity: 0.3; transform: translateY(0); }
  30% { opacity: 1; transform: translateY(-3px); }
}
</style>

<style>
/* ═══ Rendered markdown ════════════════════════════════════════════════════ */

.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }
.md p, .md ul, .md ol { margin: 0 0 11px; }
.md li { margin-bottom: 3px; }
.md ul, .md ol { padding-left: 22px; }

.md h2, .md h3 {
  margin: 20px 0 9px;
  font-weight: 600;
  line-height: 1.3;
  letter-spacing: -0.012em;
  text-wrap: balance;
}

.md h2 { font-size: 1.16em; }
.md h3 { font-size: 1.04em; }

.md a { color: var(--accent); text-underline-offset: 2px; }

.md blockquote {
  margin: 0 0 11px;
  padding-left: 13px;
  color: var(--ink-2);
  border-left: 2px solid var(--line-strong);
}

.md :not(pre) > code {
  padding: 1px 5px;
  font-family: var(--mono);
  font-size: 0.86em;
  background: var(--code-ground);
  border: 1px solid var(--line);
  border-radius: 4px;
}

.md pre {
  position: relative;
  margin: 0 0 13px;
  padding: 30px 14px 13px;
  overflow-x: auto;
  background: var(--code-ground);
  border: 1px solid var(--line);
  border-radius: 10px;
}

.md pre::before {
  content: attr(data-lang);
  position: absolute;
  top: 7px;
  left: 14px;
  color: var(--ink-3);
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.09em;
  text-transform: uppercase;
}

.md pre code {
  font-family: var(--mono);
  font-size: 12.5px;
  line-height: 1.62;
}

.copy {
  position: absolute;
  top: 5px;
  right: 7px;
  padding: 2px 8px;
  color: var(--ink-2);
  font-family: var(--mono);
  font-size: 10.5px;
  cursor: pointer;
  background: var(--raised);
  border: 1px solid var(--line);
  border-radius: 5px;
  opacity: 0;
  transition: opacity 120ms ease;
}

.md pre:hover .copy, .copy:focus { opacity: 1; }

.md .tablewrap { margin: 0 0 13px; overflow-x: auto; }

.md table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13.5px;
  font-variant-numeric: tabular-nums;
}

.md th, .md td {
  padding: 6px 12px;
  text-align: left;
  white-space: nowrap;
  border: 1px solid var(--line);
}

.md th { background: var(--sunken); font-weight: 600; }

/* A deliberately small highlight palette — the snippets on this page are
   authored here, so it only needs to cover what they actually contain. */
.t-com { color: var(--ink-3); font-style: italic; }
.t-str { color: #3d8b5f; }
.t-key { color: #8a5cc4; }
.t-num { color: #b26b28; }
.t-fn  { color: #2f7fa8; }

:root[data-theme="dark"] .t-str { color: #74c493; }
:root[data-theme="dark"] .t-key { color: #b28ce8; }
:root[data-theme="dark"] .t-num { color: #e0a06a; }
:root[data-theme="dark"] .t-fn  { color: #6cb6da; }

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .t-str { color: #74c493; }
  :root:not([data-theme="light"]) .t-key { color: #b28ce8; }
  :root:not([data-theme="light"]) .t-num { color: #e0a06a; }
  :root:not([data-theme="light"]) .t-fn  { color: #6cb6da; }
}

/* ═══ Opening screen ═══════════════════════════════════════════════════════ */

.opening {
  display: flex;
  flex: 1;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 0;
  padding: 24px;
  overflow-y: auto;
  text-align: center;
}

.opening__eyebrow {
  color: var(--ink-3);
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.opening h1 {
  margin: 12px 0 6px;
  font-size: clamp(24px, 4vw, 31px);
  font-weight: 600;
  letter-spacing: -0.03em;
  text-wrap: balance;
}

.opening p {
  max-width: 46ch;
  margin: 0;
  color: var(--ink-2);
  font-size: 14.5px;
  text-wrap: pretty;
}

.starters {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(238px, 1fr));
  gap: 8px;
  width: min(620px, 100%);
  margin-top: 26px;
}

.starter {
  display: flex;
  flex-direction: column;
  gap: 3px;
  padding: 12px 14px;
  text-align: left;
  cursor: pointer;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 11px;
  transition: border-color 120ms ease, transform 120ms ease;
}

.starter:hover { border-color: var(--accent); transform: translateY(-1px); }

.starter b { font-size: 13.5px; font-weight: 500; }

.starter span {
  color: var(--ink-3);
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

/* ═══ Composer ═════════════════════════════════════════════════════════════ */

.composer {
  flex-shrink: 0;
  width: min(748px, 100%);
  margin: 0 auto;
  padding: 10px 20px calc(12px + env(safe-area-inset-bottom));
}

.composer__box {
  display: flex;
  gap: 8px;
  align-items: flex-end;
  padding: 7px 7px 7px 14px;
  background: var(--surface);
  border: 1px solid var(--line-strong);
  border-radius: 18px;
  box-shadow: var(--shadow-lg);
}

.composer__box:focus-within { border-color: var(--accent); }

.composer textarea {
  flex: 1;
  max-height: 208px;
  padding: 7px 0;
  overflow-y: auto;
  background: none;
  border: none;
  resize: none;
}

.composer textarea:focus { outline: none; }

.go {
  display: grid;
  flex-shrink: 0;
  place-items: center;
  width: 33px;
  height: 33px;
  color: var(--accent-ink);
  cursor: pointer;
  background: var(--accent);
  border: none;
  border-radius: 50%;
}

.go:disabled { opacity: 0.3; cursor: not-allowed; }
.go--halt { color: var(--ink); background: var(--hover); }

.composer__note {
  margin: 7px 0 0;
  color: var(--ink-3);
  font-size: 11px;
  text-align: center;
}

/* ═══ Settings + docs sheets ═══════════════════════════════════════════════ */

.sheet-scrim {
  position: fixed;
  z-index: 40;
  inset: 0;
  background: rgb(6 14 14 / 0.5);
}

.sheet {
  position: fixed;
  z-index: 50;
  top: 0;
  right: 0;
  bottom: 0;
  display: flex;
  flex-direction: column;
  width: min(560px, 100%);
  background: var(--surface);
  border-left: 1px solid var(--line);
  box-shadow: var(--shadow-lg);
}

.sheet__head {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-shrink: 0;
  padding: 14px 18px;
  border-bottom: 1px solid var(--line);
}

.sheet__head h2 {
  flex: 1;
  margin: 0;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -0.01em;
}

.sheet__body {
  flex: 1;
  min-height: 0;
  padding: 18px;
  overflow-y: auto;
}

.field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 18px; }

.field__name {
  font-family: var(--mono);
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.07em;
  text-transform: uppercase;
}

.field__note { color: var(--ink-3); font-size: 12.5px; text-wrap: pretty; }

.field select, .field textarea {
  padding: 8px 10px;
  background: var(--raised);
  border: 1px solid var(--line);
  border-radius: 8px;
  resize: vertical;
}

.field select:disabled, .field textarea:disabled { opacity: 0.5; }

.switch {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  margin-bottom: 14px;
  cursor: pointer;
}

.switch input { margin-top: 4px; accent-color: var(--accent); }
.switch b { display: block; font-size: 13.5px; font-weight: 500; }
.switch small { color: var(--ink-3); font-size: 12.5px; }
.switch input:disabled ~ span { opacity: 0.45; }

.docs h3 {
  margin: 22px 0 8px;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.02em;
}

<script>
'use strict'

/* ==========================================================================
   Aida - live UI preview

   This page runs the real interface. What it cannot do is call a model: a
   published artifact may not make network requests, so answers come from a
   script written from the project's own documentation. Everything else -
   streaming, stopping, persistence, markdown, settings - is the real thing.
   ========================================================================== */

const $ = (id) => document.getElementById(id)

/* -- Markdown -------------------------------------------------------------
   Small on purpose: the assistant text on this page is authored here, so the
   renderer only has to cover what those answers actually use. User-typed text
   never reaches it - that is escaped and printed verbatim. */

function esc(text) {
  return text.replace(/[&<>"']/g, (c) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ))
}

const HIGHLIGHT = {
  ts: [
    [/(\/\/[^\n]*)/g, 't-com'],
    [/('[^'\n]*'|"[^"\n]*")/g, 't-str'],
    [/\b(const|let|await|async|function|return|export|import|from|for|while|break|continue|if|else|new|type|interface|of|in|yield|null|true|false)\b/g, 't-key'],
    [/\b(\d+)\b/g, 't-num'],
  ],
  bash: [
    [/(#[^\n]*)/g, 't-com'],
    [/('[^'\n]*'|"[^"\n]*")/g, 't-str'],
    [/^(\s*)(npm|node|docker|git|cp|echo|export|curl)\b/gm, 't-fn'],
  ],
  json: [
    [/(\/\/[^\n]*)/g, 't-com'],
    [/("(?:[^"\\]|\\.)*")(?=\s*:)/g, 't-fn'],
    [/\b(true|false|null)\b/g, 't-key'],
    [/\b(\d+)\b/g, 't-num'],
  ],
}

function highlight(code, lang) {
  const rules = HIGHLIGHT[lang]
  let out = esc(code)
  if (!rules) return out
  // Rules run over already-escaped text, so each match is parked in a slot and
  // only swapped back for real markup once every rule has passed. Without that
  // a later rule would match inside an earlier rule's <span> tag.
  const slots = []
  const park = (cls, body) => {
    slots.push('<span class="' + cls + '">' + body + '</span>')
    return '@@H' + (slots.length - 1) + '@@'
  }
  for (const [pattern, cls] of rules) {
    out = out.replace(pattern, (match, lead) => (
      cls === 't-fn' && typeof lead === 'string' && /^\s*$/.test(lead)
        ? lead + park(cls, match.slice(lead.length))
        : park(cls, match)
    ))
  }
  return out.replace(/@@H(\d+)@@/g, (_, i) => slots[Number(i)])
}

function inline(text) {
  return esc(text)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
}

function markdown(source) {
  const blocks = []
  // Fenced code is lifted out first so no inline rule can reach its contents.
  const text = source.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => {
    blocks.push(
      '<pre data-lang="' + esc(lang || 'text') + '"><code>' +
      highlight(code.replace(/\n$/, ''), lang) + '</code></pre>'
    )
    return '@@C' + (blocks.length - 1) + '@@'
  })

  const lines = text.split('\n')
  const html = []
  let list = null
  let paragraph = []

  const flushParagraph = () => {
    if (paragraph.length) { html.push('<p>' + inline(paragraph.join(' ')) + '</p>'); paragraph = [] }
  }
  const flushList = () => {
    if (list) {
      html.push('<' + list.tag + '>' +
        list.items.map((i) => '<li>' + inline(i) + '</li>').join('') +
        '</' + list.tag + '>')
      list = null
    }
  }
  const flushAll = () => { flushParagraph(); flushList() }

  for (let i = 0; i < lines.length; i += 1) {
    const line = lines[i]

    if (/^@@C\d+@@$/.test(line.trim())) { flushAll(); html.push(line.trim()); continue }
    if (!line.trim()) { flushAll(); continue }

    const heading = /^(#{2,3})\s+(.*)$/.exec(line)
    if (heading) {
      flushAll()
      html.push('<h' + heading[1].length + '>' + inline(heading[2]) + '</h' + heading[1].length + '>')
      continue
    }

    // Tables are consumed whole: header row, separator, then every body row.
    if (line.trim().startsWith('|') && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1] || '')) {
      flushAll()
      const cells = (row) => row.trim().replace(/^\||\|$/g, '').split('|').map((c) => c.trim())
      const head = cells(line)
      const body = []
      i += 2
      while (i < lines.length && lines[i].trim().startsWith('|')) { body.push(cells(lines[i])); i += 1 }
      i -= 1
      html.push(
        '<div class="tablewrap"><table><thead><tr>' +
        head.map((c) => '<th>' + inline(c) + '</th>').join('') +
        '</tr></thead><tbody>' +
        body.map((r) => '<tr>' + r.map((c) => '<td>' + inline(c) + '</td>').join('') + '</tr>').join('') +
        '</tbody></table></div>'
      )
      continue
    }

    const bullet = /^\s*[-*]\s+(.*)$/.exec(line)
    const numbered = /^\s*\d+\.\s+(.*)$/.exec(line)
    if (bullet || numbered) {
      flushParagraph()
      const tag = bullet ? 'ul' : 'ol'
      if (!list || list.tag !== tag) { flushList(); list = { tag, items: [] } }
      list.items.push((bullet || numbered)[1])
      continue
    }

    const quote = /^>\s?(.*)$/.exec(line)
    if (quote) { flushAll(); html.push('<blockquote>' + inline(quote[1]) + '</blockquote>'); continue }

    flushList()
    paragraph.push(line.trim())
  }

  flushAll()
  return html.join('').replace(/@@C(\d+)@@/g, (_, i) => blocks[Number(i)])
}

/** Gives every code block a copy button, once. */
function addCopyButtons(root) {
  root.querySelectorAll('pre').forEach((pre) => {
    if (pre.querySelector('.copy')) return
    const button = document.createElement('button')
    button.className = 'copy'
    button.type = 'button'
    button.textContent = 'copy'
    button.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(pre.querySelector('code').textContent)
        button.textContent = 'copied'
      } catch { button.textContent = 'blocked' }
      setTimeout(() => { button.textContent = 'copy' }, 1400)
    })
    pre.appendChild(button)
  })
}
</script>

<script>
'use strict'

/* -- State ----------------------------------------------------------------
   Every storage access is guarded: a private window, cleared site data, or a
   browser set to block storage all throw on read as well as write. */

const STORE_KEY = 'aida.preview.v1'

const defaults = () => ({
  conversations: [],
  activeId: null,
  settings: {
    model: 'claude-opus-5',
    effort: 'high',
    system: '',
    thinking: false,
    search: false,
  },
  theme: null,
})

let state = defaults()

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY)
    if (raw) {
      const saved = JSON.parse(raw)
      state = { ...defaults(), ...saved, settings: { ...defaults().settings, ...(saved.settings || {}) } }
    }
  } catch { /* storage unavailable - run from defaults */ }
}

function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)) } catch { /* nothing to do */ }
}

const activeConversation = () => state.conversations.find((c) => c.id === state.activeId) || null
const uid = () => 'c' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36)

/* -- Theme ---------------------------------------------------------------- */

function currentTheme() {
  if (state.theme) return state.theme
  return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
}

const SUN = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>'
const MOON = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>'

function applyTheme() {
  const theme = currentTheme()
  document.documentElement.setAttribute('data-theme', theme)
  $('theme-icon').innerHTML = theme === 'dark' ? SUN : MOON
  $('theme-label').textContent = theme === 'dark' ? '밝은 테마' : '어두운 테마'
}

/* -- Rendering ------------------------------------------------------------ */

const ICON = {
  pencil: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>',
  copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>',
  retry: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>',
  spark: '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v16M4 12h16M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>',

function renderSidebar() {
  const scroll = $('conv-scroll')
  scroll.textContent = ''

  if (state.conversations.length === 0) return

  const label = document.createElement('div')
  label.className = 'conv-label'
  label.textContent = 'conversations'
  scroll.appendChild(label)

  for (const conversation of state.conversations) {
    const row = document.createElement('div')
    row.className = 'conv'
    if (conversation.id === state.activeId) row.setAttribute('aria-current', 'true')

    const open = document.createElement('button')
    open.className = 'conv__open'
    open.textContent = conversation.title
    open.addEventListener('click', () => {
      state.activeId = conversation.id
      save()
      renderAll()
      if (innerWidth <= 880) setSidebar(false)
    })

    const tools = document.createElement('span')
    tools.className = 'conv__tools'

    const rename = document.createElement('button')
    rename.className = 'ibtn ibtn--sm'
    rename.innerHTML = ICON.pencil
    rename.title = '이름 변경'
    rename.setAttribute('aria-label', conversation.title + ' 이름 변경')
    rename.addEventListener('click', () => startRename(row, conversation))

    const remove = document.createElement('button')
    remove.className = 'ibtn ibtn--sm ibtn--danger'
    remove.innerHTML = ICON.trash
    remove.title = '삭제'
    remove.setAttribute('aria-label', conversation.title + ' 삭제')
    remove.addEventListener('click', () => {
      state.conversations = state.conversations.filter((c) => c.id !== conversation.id)
      if (state.activeId === conversation.id) state.activeId = null
      save()
      renderAll()
    })

    tools.append(rename, remove)
    row.append(open, tools)
    scroll.appendChild(row)
  }
}

function startRename(row, conversation) {
  row.textContent = ''
  const input = document.createElement('input')
  input.className = 'conv__rename'
  input.value = conversation.title
  const commit = () => {
    const next = input.value.trim()
    if (next) conversation.title = next
    save()
    renderAll()
  }
  input.addEventListener('blur', commit)
  input.addEventListener('keydown', (event) => {
    if (event.key === 'Enter') commit()
    if (event.key === 'Escape') renderAll()
  })
  row.appendChild(input)
  input.focus()
  input.select()
}

function turnElement(turn) {
  const article = document.createElement('article')
  article.className = 'turn turn--' + (turn.role === 'you' ? 'you' : 'aida')

  if (turn.role !== 'you') {
    const mark = document.createElement('div')
    mark.className = 'turn__mark'
    mark.innerHTML = ICON.spark
    article.appendChild(mark)
  }

  const body = document.createElement('div')
  body.className = 'turn__body'

  if (turn.role === 'you') {
    const said = document.createElement('p')
    said.className = 'turn__said'
    said.textContent = turn.text
    body.appendChild(said)
  } else {
    if (turn.reasoning) {
      const panel = document.createElement('details')
      panel.className = 'reasoning'
      panel.open = true
      panel.innerHTML = '<summary>reasoning</summary><p></p>'
      panel.querySelector('p').textContent = turn.reasoning
      body.appendChild(panel)
    }
    const md = document.createElement('div')
    md.className = 'md'
    md.innerHTML = markdown(turn.text)
    addCopyButtons(md)
    body.appendChild(md)
  }

  const meta = document.createElement('div')
  meta.className = 'turn__meta'

  const copy = document.createElement('button')
  copy.className = 'ibtn ibtn--sm'
  copy.innerHTML = ICON.copy
  copy.title = '복사'
  copy.setAttribute('aria-label', '이 메시지 복사')
  copy.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(turn.text)
      const flash = document.createElement('span')
      flash.className = 'flash'
      flash.textContent = 'copied'
      meta.appendChild(flash)
      setTimeout(() => flash.remove(), 1400)
    } catch { /* clipboard blocked - nothing useful to show */ }
  })
  meta.appendChild(copy)

  if (turn.role !== 'you' && turn.last) {
    const again = document.createElement('button')
    again.className = 'ibtn ibtn--sm'
    again.innerHTML = ICON.retry
    again.title = '다시 생성'
    again.setAttribute('aria-label', '이 답변 다시 생성')
    again.addEventListener('click', regenerate)
    meta.appendChild(again)
  }

  if (turn.model) {
    const stamp = document.createElement('span')
    stamp.className = 'turn__stamp'
    stamp.textContent = turn.model
    meta.appendChild(stamp)
  }

  body.appendChild(meta)
  article.appendChild(body)
  return article
}

function renderThread() {
  const conversation = activeConversation()
  const inner = $('thread-inner')
  const hasTurns = conversation && conversation.turns.length > 0

  $('opening').hidden = hasTurns
  $('thread').hidden = !hasTurns
  $('pane-title').textContent = conversation ? conversation.title : '새 대화'
  $('chip-model').textContent = state.settings.model

  inner.textContent = ''
  if (!hasTurns) return

  const lastAida = [...conversation.turns].reverse().find((t) => t.role === 'aida')
  for (const turn of conversation.turns) {
    inner.appendChild(turnElement({ ...turn, last: turn === lastAida && !streamingTurn }))
  }
  if (streamingTurn) inner.appendChild(streamingTurn.node)
  scrollThread()
}

function renderAll() {
  renderSidebar()
  renderThread()
  syncSettings()
}

let stickToBottom = true

function scrollThread() {
  if (!stickToBottom) return
  const thread = $('thread')
  thread.scrollTop = thread.scrollHeight
}

<script>
'use strict'

/* -- The turn -------------------------------------------------------------
   Answers arrive a word at a time on a timer, the way the real SSE stream
   delivers deltas. Markdown is re-parsed once per animation frame rather than
   once per token, so a long code fence does not re-highlight on every word. */

let streamingTurn = null

function setBusy(busy) {
  const go = $('go')
  go.classList.toggle('go--halt', busy)
  go.title = busy ? '생성 중지' : '보내기 (Enter)'
  go.setAttribute('aria-label', busy ? '생성 중지' : '보내기')
  go.innerHTML = busy
    ? '<svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>'
    : '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>'
  go.disabled = !busy && !$('input').value.trim()
}

function ask(question) {
  if (streamingTurn) return
  const text = question.trim()
  if (!text) return

  let conversation = activeConversation()
  if (!conversation) {
    conversation = { id: uid(), title: text.slice(0, 38) || '새 대화', turns: [] }
    state.conversations.unshift(conversation)
    state.activeId = conversation.id
  }

  conversation.turns.push({ role: 'you', text })
  $('input').value = ''
  $('input').style.height = 'auto'
  stickToBottom = true
  save()
  renderAll()
  respond(conversation, text)
}

function regenerate() {
  const conversation = activeConversation()
  if (!conversation || streamingTurn) return

  // Same contract as the server's retryFromMessageId: drop the last answer and
  // everything after it, then answer the question that preceded it again.
  let index = conversation.turns.length - 1
  while (index >= 0 && conversation.turns[index].role !== 'aida') index -= 1
  if (index < 0) return

  const question = conversation.turns.slice(0, index).reverse().find((t) => t.role === 'you')
  conversation.turns = conversation.turns.slice(0, index)
  save()
  renderAll()
  if (question) respond(conversation, question.text)
}

function respond(conversation, question) {
  const answer = pickAnswer(question)
  const model = state.settings.model
  const showReasoning = state.settings.thinking && MODELS.find((m) => m.id === model).thinking

  const node = document.createElement('article')
  node.className = 'turn turn--aida'
  node.innerHTML =
    '<div class="turn__mark">' + ICON.spark + '</div>' +
    '<div class="turn__body">' +
    (showReasoning ? '<details class="reasoning" open><summary>reasoning</summary><p></p></details>' : '') +
    '<div class="md"><span class="waiting"><i></i><i></i><i></i></span></div>' +
    '</div>'

  const body = node.querySelector('.md')
  const reasoningSlot = node.querySelector('.reasoning p')

  streamingTurn = { node, answer, model, showReasoning, text: '', cancelled: false }
  setBusy(true)
  renderThread()

  // Words, keeping their leading whitespace, so line breaks survive.
  const tokens = answer.text.match(/\s*\S+/g) || []
  let cursor = 0
  let dirty = false
  let frame = null

  const paint = () => {
    frame = null
    if (!dirty || !streamingTurn) return
    dirty = false
    body.innerHTML = markdown(streamingTurn.text) + '<span class="caret"></span>'
    scrollThread()
  }

  const tick = () => {
    if (!streamingTurn || streamingTurn.cancelled) return

    if (cursor < tokens.length) {
      streamingTurn.text += tokens[cursor]
      cursor += 1
      dirty = true
      if (!frame) frame = requestAnimationFrame(paint)
      // A code fence streams faster than prose, the way real token rates feel.
      setTimeout(tick, streamingTurn.text.endsWith('\n') ? 24 : 11)
      return
    }
    finish()
  }

  const finish = () => {
    if (!streamingTurn) return
    const { text, cancelled } = streamingTurn
    if (frame) cancelAnimationFrame(frame)
    streamingTurn = null
    setBusy(false)

    if (text.trim()) {
      conversation.turns.push({
        role: 'aida',
        text: cancelled ? text + '\n\n*(중단됨)*' : text,
        reasoning: showReasoning ? answer.reasoning : '',
        model,
      })
    }
    save()
    renderAll()
  }

  streamingTurn.finish = finish

  if (showReasoning) {
    // Reasoning lands before the answer, as it does in the real stream.
    let shown = 0
    const typeReasoning = () => {
      if (!streamingTurn || streamingTurn.cancelled) return
      shown += 2
      reasoningSlot.textContent = answer.reasoning.slice(0, shown)
      if (shown < answer.reasoning.length) setTimeout(typeReasoning, 16)
      else setTimeout(tick, 180)
    }
    setTimeout(typeReasoning, 240)
  } else {
    setTimeout(tick, 420)
  }
}

function halt() {
  if (!streamingTurn) return
  streamingTurn.cancelled = true
  streamingTurn.finish()
}

/* -- Sheets --------------------------------------------------------------- */

function openSheet(id) {
  $('scrim').hidden = false
  $(id).hidden = false
  $(id).querySelector('button').focus()
}

function closeSheets() {
  $('scrim').hidden = true
  $('settings-sheet').hidden = true
  $('docs-sheet').hidden = true
}

function syncSettings() {
  const { settings } = state
  const spec = MODELS.find((m) => m.id === settings.model) || MODELS[0]

  $('set-model').value = settings.model
  $('model-note').textContent = spec.note
  $('set-effort').value = settings.effort
  $('set-effort').disabled = !spec.effort
  $('effort-note').textContent = spec.effort
    ? '한 턴에 쓰는 사고량입니다. 현재 세대 모델에서 temperature를 대체합니다.'
    : spec.name + '은(는) effort 설정을 받지 않습니다.'
  $('set-system').value = settings.system
  $('set-thinking').checked = settings.thinking
  $('set-thinking').disabled = !spec.thinking
  $('set-search').checked = settings.search
  $('set-search').disabled = !spec.search
}

const DOCS = [
  '<h3>이 페이지는 무엇인가요</h3>',
  '<p>Aida의 실제 인터페이스입니다. 스트리밍, 중단, 대화 저장, 마크다운 렌더링, 설정 — 전부 실제 코드와 같은 동작입니다. 다만 게시된 아티팩트는 외부로 네트워크 요청을 보낼 수 없어서, 답변은 모델이 아니라 이 프로젝트 문서에서 만든 대본에서 나옵니다.</p>',
  '<p>진짜 모델 응답을 받으려면 백엔드를 직접 띄우면 됩니다. 아래가 전부입니다.</p>',
  '<h3>로컬에서 실행</h3>',
  '@@RUN@@',
  '<p>프론트엔드는 <code>localhost:5173</code>, API는 <code>localhost:8787</code>입니다. 키가 없으면 서버가 데모 모드로 뜨고, 앱은 그대로 동작합니다.</p>',
  '<h3>Docker</h3>',
  '@@DOCKER@@',
  '<p><code>localhost:8080</code>에서 열립니다. 대화 기록은 이름 붙은 볼륨에 남습니다.</p>',
  '<h3>환경 변수</h3>',
  '@@ENV@@',
  '<p>API 키는 서버만 읽습니다. 브라우저로 내려가지 않고 번들에도 들어가지 않습니다. 키는 <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener noreferrer">Anthropic 콘솔</a>에서 발급합니다.</p>',
].join('')

function renderDocs() {
  const run = markdown('```bash\nnpm install\ncp .env.example .env\necho "ANTHROPIC_API_KEY=sk-ant-..." >> .env\nnpm run dev\n```')
  const docker = markdown('```bash\nexport ANTHROPIC_API_KEY=sk-ant-...\ndocker compose up --build\n```')
  const env = markdown([
    '| 변수 | 기본값 | 뜻 |',
    '| --- | --- | --- |',
    '| `ANTHROPIC_API_KEY` | (비어 있음) | 비우면 데모 모드 |',
    '| `DEFAULT_MODEL` | `claude-opus-5` | 클라이언트가 안 고를 때 쓰는 모델 |',
    '| `PORT` | `8787` | API 포트 |',
    '| `CORS_ORIGIN` | `*` | 허용 오리진 목록 |',
    '| `DATA_DIR` | `./data` | SQLite 파일 위치 |',
  ].join('\n'))

  const body = $('docs-body')
  body.innerHTML = DOCS.replace('@@RUN@@', run).replace('@@DOCKER@@', docker).replace('@@ENV@@', env)
  addCopyButtons(body)
}

/* -- Wiring --------------------------------------------------------------- */

function setSidebar(open) {
  $('workspace').dataset.sidebar = open ? 'open' : 'closed'
  $('show-sidebar').hidden = open
}

function boot() {
  load()
  applyTheme()

  for (const model of MODELS) {
    const option = document.createElement('option')
    option.value = model.id
    option.textContent = model.name
    $('set-model').appendChild(option)
  }

  for (const starter of STARTERS) {
    const button = document.createElement('button')
    button.className = 'starter'
    button.innerHTML = '<span></span><b></b>'
    button.querySelector('span').textContent = starter.tag
    button.querySelector('b').textContent = starter.label
    button.addEventListener('click', () => ask(starter.label))
    $('starters').appendChild(button)
  }

  const input = $('input')
  input.addEventListener('input', () => {
    input.style.height = 'auto'
    input.style.height = Math.min(input.scrollHeight, 208) + 'px'
    if (!streamingTurn) $('go').disabled = !input.value.trim()
  })
  input.addEventListener('keydown', (event) => {
    // Enter sends; Shift+Enter and an open IME composition insert a newline.
    if (event.key !== 'Enter' || event.shiftKey || event.isComposing) return
    event.preventDefault()
    if (!streamingTurn) ask(input.value)
  })

  $('go').addEventListener('click', () => (streamingTurn ? halt() : ask(input.value)))

  $('new-chat').addEventListener('click', () => {
    halt()
    state.activeId = null
    save()
    renderAll()
    if (innerWidth <= 880) setSidebar(false)
    input.focus()
  })

  $('hide-sidebar').addEventListener('click', () => setSidebar(false))
  $('show-sidebar').addEventListener('click', () => setSidebar(true))

  $('toggle-theme').addEventListener('click', () => {
    state.theme = currentTheme() === 'dark' ? 'light' : 'dark'
    save()
    applyTheme()
  })

  $('open-settings').addEventListener('click', () => openSheet('settings-sheet'))
  $('open-docs').addEventListener('click', () => { renderDocs(); openSheet('docs-sheet') })
  $('scrim').addEventListener('click', closeSheets)
  document.querySelectorAll('[data-close-sheet]').forEach((b) => b.addEventListener('click', closeSheets))
  addEventListener('keydown', (event) => { if (event.key === 'Escape') closeSheets() })

  $('set-model').addEventListener('change', (e) => {
    state.settings.model = e.target.value
    const spec = MODELS.find((m) => m.id === e.target.value)
    // Keep the stored settings honest about what the chosen model accepts.
    if (!spec.thinking) state.settings.thinking = false
    if (!spec.search) state.settings.search = false
    save()
    syncSettings()
    renderThread()
  })
  $('set-effort').addEventListener('change', (e) => { state.settings.effort = e.target.value; save() })
  $('set-system').addEventListener('input', (e) => { state.settings.system = e.target.value; save() })
  $('set-thinking').addEventListener('change', (e) => { state.settings.thinking = e.target.checked; save() })
  $('set-search').addEventListener('change', (e) => { state.settings.search = e.target.checked; save() })

  $('thread').addEventListener('scroll', () => {
    const el = $('thread')
    stickToBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 110
  }, { passive: true })

  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (!state.theme) applyTheme() })

  if (innerWidth <= 880) setSidebar(false)
  setBusy(false)
  renderAll()
}

boot()
</script>
